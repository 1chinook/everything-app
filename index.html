<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/app-icon-192.png">
  <meta name="theme-color" content="#f7f7f2">
  <meta name="description" content="Everything App ile derslerini, görevlerini ve günlük planını bir arada gör.">
  <title>Bugün · Everything App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700;750;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="fitness.css">
  <link rel="stylesheet" href="discover.css">
  <script defer src="courses.js"></script>
  <script defer src="planner.js"></script>
  <script defer src="sync.js"></script>
  <script defer src="fitness.js"></script>
  <script defer src="discover.js"></script>
  <script defer src="personal.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" aria-label="Kenar menüsü">
      <a href="#bugun" class="brand"><span class="brand-icon" data-icon="layers"></span><span>Everything<span class="brand-suffix"> App</span></span></a>
      <nav class="navigation" id="space-navigation" aria-label="Alan menüsü"></nav>
      <a class="button secondary" href="#ara" aria-label="Site genelinde ara">Her yerde ara</a>

    </aside>
    <main class="workspace" id="main">
      <header class="topbar">
        <div class="breadcrumb"><strong id="current-page">Bugün</strong></div>
        <div class="topbar-actions">
          <button type="button" class="button secondary" data-planner="quick"><span data-icon="sparkle"></span>Hızlı kayıt</button>
          <button type="button" class="button primary" data-action="add-task"><span data-icon="plus"></span>Görev ekle</button>
        </div>
      </header>
      <div class="content" id="content">
        <p class="panel startup-message">Uygulama yükleniyor. Bu mesaj kalırsa sayfayı yenile.</p>
      </div>
    </main>
  </div>
  <dialog id="editor" aria-labelledby="editor-title">
    <form id="editor-form" class="editor">
      <div class="editor-header"><h2 id="editor-title"></h2><button type="button" class="icon-button" aria-label="Kapat" data-action="close-dialog"><span data-icon="x"></span></button></div>
      <div id="editor-fields" class="form-fields"></div>
      <div class="editor-actions"><button type="button" class="button danger" data-action="delete-record" hidden>Sil</button><button type="button" class="button secondary" data-action="close-dialog">Vazgeç</button><button class="button primary" type="submit">Kaydet</button></div>
    </form>
  </dialog>
  <dialog id="planner-editor" aria-labelledby="planner-title">
    <form id="planner-form" class="editor">
      <div class="editor-header"><h2 id="planner-title"></h2><button type="button" class="icon-button" aria-label="Kapat" data-planner="close"><span data-icon="x"></span></button></div>
      <div id="planner-fields" class="form-fields"></div>
      <p id="planner-feedback" class="form-feedback" role="status"></p>
      <div class="editor-actions"><button type="button" class="button danger" data-planner="remove-assessment" hidden>Sil</button><button type="button" class="button secondary" data-planner="close">Vazgeç</button><button class="button primary" type="submit" id="planner-submit">Kaydet</button></div>
    </form>
  </dialog>
  <datalist id="course-names"></datalist>
  <div id="status" role="status" class="sr-only"></div>
</body>
</html>
